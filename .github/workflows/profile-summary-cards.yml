name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: summary
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Must be a PAT, not the built-in GITHUB_TOKEN: the Actions installation
          # token cannot read user-scoped GraphQL fields (contributionsCollection),
          # so 0-profile-details and 3-stats fail with
          # "Resource not accessible by integration".
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: yujh404
          AUTO_PUSH: true
